<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Search Extractor</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>

    <div class="container">

        <h1>Google Search Extractor</h1>

        <form class="search-area" id="searchForm">
            <input type="text" id="query" placeholder="Zadejte klíčové slovo nebo slovní spojení..." autocomplete="off">

            <button id="searchBtn" type="submit" disabled>
                Hledat
            </button>
        </form>
        <div id="status"></div>

        <div id="actionsArea">
            <button id="exportBtn" disabled>
                Exportovat JSON
            </button>
        </div>

        <div id="results"></div>

    </div>


</body>

</html>
